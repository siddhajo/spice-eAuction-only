<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My Documents</title>
<style>
  /* Deliberately one small file: no framework, no webfont, no icon library.
     The people this is for are on a phone on mobile data, and the admin SPA
     next door is 3.1 MB. Every icon here is inline SVG from one <symbol>
     sheet, so the whole set costs about a kilobyte and inherits currentColor
     in both themes. */
  /* Cardamom green, not grey. The first cut was a cool-neutral palette with
     one very dark accent, which read as a grey form with a green button on
     it. Three things carry the colour now: a gradient header that is the
     first thing on screen, an accent bright enough to survive a 17px icon
     (#0f8b4c against the old #1f6f43, which went almost black at that size),
     and a stripe tinted green rather than grey so the list belongs to the
     same page. Text contrast went UP at the same time — vibrancy is no use
     to someone who cannot read the number. */
  :root{
    /* Tell the BROWSER which theme to draw native widgets in. Without this
       the page picks its palette from prefers-color-scheme while the OS
       keeps drawing <select> popups, scrollbars and form controls to its
       own default — which is how a light page ended up opening a dark grey
       dropdown with a blue highlight in it. CSS cannot style a native
       select popup; declaring the scheme is the whole of the fix. */
    color-scheme: light;
    --bg:#eff4f1; --card:#fff; --ink:#0c1a12; --muted:#56685d;
    --line:#d7e3da; --accent:#0f8b4c; --accent-ink:#fff;
    --accent-dark:#0a6b3a; --accent-soft:#d9f0e2; --stripe:#f2f9f5;
    --danger:#c0392b;
    --shadow:0 1px 3px rgba(12,26,18,.10), 0 1px 2px rgba(12,26,18,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ color-scheme: dark;
           --bg:#0d1711; --card:#17241c; --ink:#e8f3ec; --muted:#93ab9d;
           --line:#27382d; --accent:#2ecc71; --accent-ink:#04240f;
           --accent-dark:#1f9e55; --accent-soft:#143024; --stripe:#1c2a22;
           --danger:#ff7f6e;
           --shadow:0 1px 3px rgba(0,0,0,.45); }
  }
  *{box-sizing:border-box}
  /* 18px base, not 16. The people reading this are growers, often older,
     outdoors, holding the phone at arm's length — and every size below is
     derived from that rather than from a desktop default. */
  body{margin:0;background:var(--bg);color:var(--ink);
       font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}
  /* ── One screen, one scroller ─────────────────────────────────────────
     The page itself does not scroll: the shell is exactly the viewport
     tall, the chrome is fixed, and the document list takes whatever is
     left and scrolls inside itself. 100dvh (not vh) so the mobile address
     bar collapsing does not leave a dead strip at the bottom. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  @supports (height:100dvh){ body{height:100dvh} }
  .wrap{max-width:720px;width:100%;margin:0 auto;padding:12px 16px 0;
        flex:1;min-height:0;display:flex;flex-direction:column}
  /* The sign-in cards are short; let them sit at the top and scroll if a
     small landscape screen cannot take them. */
  /* The sign-in cards sit in the MIDDLE of the screen, not pinned under the
     bar with a third of a page of nothing below them. */
  #step-phone,#step-code{overflow-y:auto;flex:1;min-height:0;
                         display:flex;flex-direction:column;justify-content:center}
  /* ── Cardamom, scattered behind the sign-in ───────────────────────────
     The screen was a white box on an empty field. These sit BEHIND
     everything (pointer-events off, aria-hidden) at low opacity, so the
     page has a subject without competing with the one input on it. Sized
     in vmin so the arrangement holds from a 5-inch phone to a desktop. */
  .pods{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .pods svg{position:absolute;color:var(--accent)}
  .pods .p1{top:4%;left:-8%;width:26vmin;opacity:.10;transform:rotate(-24deg)}
  .pods .p2{top:1%;right:-6%;width:20vmin;opacity:.13;transform:rotate(18deg)}
  .pods .p3{bottom:15%;left:2%;width:15vmin;opacity:.11;transform:rotate(12deg)}
  .pods .p4{bottom:7%;right:-7%;width:24vmin;opacity:.09;transform:rotate(-14deg)}
  .pods .p5{top:43%;right:5%;width:10vmin;opacity:.08;transform:rotate(34deg)}
  @media (prefers-color-scheme:dark){
    .pods .p1{opacity:.15} .pods .p2{opacity:.18} .pods .p3{opacity:.15}
    .pods .p4{opacity:.13} .pods .p5{opacity:.12}
  }
  #step-phone,#step-code{position:relative}
  #step-phone > div:not(.pods),#step-code > div{position:relative;z-index:1}

  /* A cluster above the headline - the one place a pod is meant to be
     looked AT rather than felt. */
  .crest{display:flex;align-items:flex-end;justify-content:center;gap:4px;
         margin-bottom:13px;color:var(--accent)}
  .crest svg{width:30px;opacity:.8}
  .crest .mid{width:42px;opacity:1}

  .lead{text-align:center;margin:0 4px 18px}
  .lead h2{margin:0 0 7px;font-size:21px;font-weight:700;letter-spacing:-.015em}
  .lead p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
  /* Three plain facts, because the first thing a grower wants to know about
     a login screen he has never seen is what is behind it. */
  .assure{display:flex;flex-direction:column;gap:9px;margin:16px 2px 0}
  .assure div{display:flex;align-items:flex-start;gap:10px;font-size:14px;
              color:var(--muted);line-height:1.45}
  .assure svg{flex:none;margin-top:2px;color:var(--accent)}
  #step-docs{flex:1;min-height:0;display:flex;flex-direction:column}

  /* A real app bar: pinned to the top, full-bleed, and NOT a rounded card.
     Sticking a rounded card to top:0 leaves a transparent sliver above it
     that the list scrolls through, which looks like a bug. Full-bleed also
     lets it carry the notch inset on a modern phone. */
  header{position:sticky;top:0;z-index:30;color:#fff;
         background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);
         box-shadow:0 2px 12px rgba(12,26,18,.18);
         padding-top:env(safe-area-inset-top,0px)}
  header .hwrap{max-width:720px;margin:0 auto;padding:10px 16px;
                display:flex;align-items:center;gap:11px}
  header .grow{flex:1;min-width:0}
  /* Sign out lives in the bar now — it was an 80px block at the bottom of
     a page that should not need a bottom. */
  header .out{flex:none;width:38px;height:38px;border-radius:10px;border:0;
              background:rgba(255,255,255,.16);color:#fff;display:grid;
              place-items:center;cursor:pointer;margin:0;padding:0}
  header .mark{width:36px;height:36px;border-radius:10px;flex:none;
               background:rgba(255,255,255,.92);color:var(--accent);
               display:grid;place-items:center}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.015em;color:#fff;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .co{font-size:13px;margin-top:0;color:rgba(255,255,255,.85);font-weight:500;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  label{display:block;font-size:15px;color:var(--muted);margin-bottom:8px;font-weight:500}
  .field{position:relative}
  .field .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);
              color:var(--muted);pointer-events:none}
  /* `appearance:none` is for the TEXT and SELECT controls. A checkbox caught
     by this rule keeps its box and loses its tick — it renders as an empty
     rounded rectangle that never visibly changes, which is exactly as
     useless as it sounds. Checkboxes are styled by `accent-color` instead,
     below. */
  input:not([type=checkbox]),select{width:100%;padding:14px 12px;font-size:19px;
       border:1px solid var(--line);border-radius:10px;background:var(--bg);
       color:var(--ink);appearance:none}
  input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
  /* Honoured on Android and Windows; macOS draws its own menu and ignores
     these, which is why color-scheme above is the part that matters. */
  select option{background:var(--card);color:var(--ink)}
  select option:checked{background:var(--accent-soft)}
  /* 17px is not taste: iOS Safari zooms the whole page on focus below 16px. */
  .field input{padding-left:40px}
  input:not([type=checkbox]):focus,select:focus{outline:2px solid var(--accent);
       outline-offset:-1px;border-color:transparent}
  input[inputmode="numeric"]{letter-spacing:.06em}

  button{width:100%;padding:14px;font-size:18px;font-weight:600;border:0;border-radius:10px;
         background:var(--accent);color:var(--accent-ink);cursor:pointer;margin-top:14px;
         display:inline-flex;align-items:center;justify-content:center;gap:8px}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
  /* Sign out reads as a leave-action, so it gets its own colour rather than
     the brand green (which everywhere else on this page means "open a
     document"). Tinted rather than solid — it is not the thing we want a
     thumb to land on by accident. */
  /* A transparent red over a green-tinted page mixes to mud — this needs
     its own opaque ground, not a tint of whatever is behind it. */
  button.leave{background:#fdeceb;color:#b3271a;border:1.5px solid #f5cfcb;font-weight:650}
  button[disabled]{opacity:.5;cursor:default}

  .msg{padding:12px 14px;border-radius:10px;font-size:15.5px;margin-top:13px;
       display:flex;gap:9px;align-items:flex-start}
  .msg svg{flex:none;margin-top:2px}
  .msg.err{background:color-mix(in srgb,var(--danger) 11%,transparent);color:var(--danger)}
  #doclist > .msg{margin:12px 14px}
  .msg.info{background:var(--accent-soft);color:var(--accent-dark)}
  .msg.warn{background:#fff3e0;color:#9a5b00}
  /* The countdown. Tabular figures so the line does not jiggle each second,
     which is distracting on a screen somebody is reading a code onto. */
  .msg b{font-variant-numeric:tabular-nums;font-weight:700}
  #resend{margin-top:10px}

  /* ── The party selector ──────────────────────────────────────────────
     A <select>, not a row of tiles. One handset can hold seventeen
     parties here; as tiles that is a wall of buttons that pushes the
     documents off the screen, and on a phone the native picker is both
     smaller and easier to use than anything we could draw. */
  .who{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
  .who .sel{flex:1;position:relative}
  .who select{padding:12px 38px 12px 42px;font-size:17px;font-weight:700;
              background:var(--card);border-radius:11px;color:var(--ink);
              border-color:var(--accent-soft);box-shadow:var(--shadow)}
  .who .avatar{position:absolute;left:11px;top:50%;transform:translateY(-50%);
               color:var(--accent);pointer-events:none}
  .who .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);
             color:var(--muted);pointer-events:none}
  .who .one{flex:1;min-width:0;display:flex;align-items:center;gap:9px;font-weight:700;
            font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Whose sign-in is this? On a shared handset the party name alone does not
     answer that — the NUMBER is the account. */
  /* The number rides on the same line as the name — two lines to say who
     is signed in is one more than it needs. */
  .signed{font-size:13.5px;color:var(--muted);font-weight:500;flex:none;
          white-space:nowrap}
  .signed b{font-weight:700;color:var(--accent-dark);font-variant-numeric:tabular-nums;letter-spacing:.02em}

  /* Count on the left, financial-year picker on the right — the year is a
     filter, not an identity, so it does not deserve the full-width row the
     party selector gets. */
  /* Year and month sit together on their own row — two pickers, because
     "show me October" and "show me this year" are the two ways a grower
     asks for their papers. The count and the bulk button share the row
     below them. */
  .period{display:flex;gap:8px;margin:0 0 9px}
  .period .yr{flex:1}
  .period .yr select{width:100%}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 9px}
  /* Download-everything-shown. Sized as a link rather than a block button:
     it belongs to the list under it, not to the page. */
  .grab{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:650;
        color:var(--accent-ink);background:var(--accent);border:0;border-radius:9px;
        padding:9px 14px;cursor:pointer;width:auto;margin:0;
        box-shadow:0 1px 3px rgba(15,139,76,.3)}
  .grab[disabled]{opacity:.55;cursor:default}
  .grab.plain{background:var(--card);color:var(--accent);border:1.5px solid var(--accent-soft);
              box-shadow:none}
  .bar .btns{display:flex;gap:7px;flex:none}

  /* ── Select mode ──────────────────────────────────────────────────────
     Checkboxes and the per-row View/Download buttons are ALTERNATIVES, not
     neighbours: at 414px with 18px type there is room for one or the other,
     and a row carrying both re-truncates "Auction 21". Hiding the buttons
     while selecting is also the honest reading — you are picking documents,
     not opening them. */
  .doc .pick{width:24px;height:24px;flex:none;margin:0;accent-color:var(--accent)}
  .doc.on{background:var(--accent-soft)}
  .selall{display:flex;align-items:center;gap:11px;padding:11px 18px;
          border-bottom:1px solid var(--line);font-size:15px;font-weight:600;
          color:var(--muted);cursor:pointer;position:sticky;top:0;
          background:var(--card);z-index:1}
  /* The app bar wins any overlap with the list's own sticky header. */
  .selall input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--accent)}
  .count{font-size:14px;color:var(--muted)}

  /* ── The headline band ────────────────────────────────────────────────
     What a seller actually came to find out: how much, over how much
     cardamom, and when they last traded. Money first and largest — the
     rest is context for it. */
  /* One band, three facts, ~56px — the three-tile grid was 290px of a
     screen that should mostly be documents. */
  .band{display:flex;align-items:center;gap:14px;flex:none;margin-bottom:10px;
        padding:11px 15px;border-radius:14px;color:#fff;
        background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);
        box-shadow:0 3px 12px rgba(15,139,76,.22)}
  .band .big{flex:1;min-width:0}
  .band .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;
           color:rgba(255,255,255,.8);font-weight:650}
  .band .v{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15;
           font-variant-numeric:tabular-nums}
  .band .side{text-align:right;flex:none}
  .band .side .v{font-size:15px}

  /* ── Who to ring ──────────────────────────────────────────────────────
     A statement with no way to query it is a complaint waiting to happen.
     The number is a tel: link, because the point is to be rung. */
  /* A strip, not a card. The address and GSTIN are a tap away rather than
     290px of every screen — what a customer needs at a glance is the
     office's number. */
  .help{flex:none;margin-top:auto;margin-bottom:10px}
  .help .strip{display:flex;align-items:center;gap:10px;width:100%;
               background:var(--card);border:1px solid var(--line);border-radius:12px;
               padding:11px 14px;font-size:14px;font-weight:600;color:var(--ink);
               cursor:pointer;box-shadow:var(--shadow);margin:0}
  .help .strip .nm{flex:1;min-width:0;text-align:left;white-space:nowrap;
                   overflow:hidden;text-overflow:ellipsis}
  .help .strip .call{color:var(--accent)}
  .help .more{display:none;padding:12px 14px 2px;font-size:13.5px;color:var(--muted);
              line-height:1.55}
  .help.open .more{display:block}
  .help .more .addr{margin-bottom:2px}
  .help .more .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .help .more a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
                font-size:14px;font-weight:600;color:var(--accent);
                background:var(--accent-soft);border-radius:9px;padding:8px 12px}
  .help .gst{font-size:12px;color:var(--muted);margin-top:9px;
             font-variant-numeric:tabular-nums}
  header .mark img{width:100%;height:100%;object-fit:contain;border-radius:9px}
  .yr{position:relative;flex:none}
  .yr select{width:auto;padding:8px 30px 8px 12px;font-size:14px;font-weight:650;
             background:var(--card);border-radius:10px;color:var(--ink);
             border-color:var(--accent-soft);box-shadow:none}
  .yr .chev{position:absolute;right:9px;top:50%;transform:translateY(-50%);
            color:var(--muted);pointer-events:none}

  /* The list scrolls inside its own card rather than the page: the party
     picker and the year stay put while a grower with forty bills scrolls
     through them. Capped against the viewport so it is never taller than
     the screen on a phone, and never a stub on a desktop. */
  /* `flex:0 1 auto`, not `flex:1`: the card takes the height its rows need
     and shrinks to fit when there are too many — a seller with ONE bill was
     getting a card stretched down the whole screen with a single line in
     it. The contact strip is pushed to the bottom by its own auto margin
     instead, so the layout still reaches the foot of the screen. */
  #doclist{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
           -webkit-overflow-scrolling:touch;padding:0;overflow-x:hidden;
           margin-bottom:10px}
  #doclist::-webkit-scrollbar{width:9px}
  #doclist::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;
           border:3px solid var(--card)}

  /* ── A statement row ──────────────────────────────────────────────────
     Title and amount share the top line, date and auction sit under it.
     The amount is a right-aligned column again — a column of figures is
     scannable in a way a figure buried mid-sentence is not — and there is
     room for it because the row ITSELF now opens the document, so the
     green "view" square is gone. Fourteen heavy buttons down a list is
     what made the page feel like a form. */
  .doc{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;
       transition:background .12s ease}
  .doc.alt{background:var(--stripe)}
  .doc:active{background:var(--accent-soft)}
  .doc .grow{flex:1;min-width:0}
  .doc .top{display:flex;align-items:baseline;gap:10px}
  .doc .t{flex:1;min-width:0;font-weight:650;font-size:16px;line-height:1.3;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .amt{flex:none;font-size:15.5px;font-weight:700;color:var(--accent-dark);
            font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .doc .s{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:1px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* A disclosure arrow. Making the whole row tappable looks better than a
     green square on every line, but without a cue that it IS tappable it
     is just a prettier dead end — and the people reading this will not go
     prodding a list to find out. */
  .doc .go{flex:none;color:var(--line);display:grid;place-items:center;
           margin-left:-4px;transition:color .12s ease}
  .doc:active .go{color:var(--accent)}
  .acts{display:flex;gap:6px;flex:none}
  .acts a{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
          border:1.5px solid var(--accent-soft);color:var(--accent);
          text-decoration:none;background:var(--card);transition:transform .1s ease}
  .acts a:active{transform:scale(.92)}
  .doc.on{background:var(--accent-soft)}
  .doc .pick{width:24px;height:24px;flex:none;margin:0;accent-color:var(--accent)}
  .selall{display:flex;align-items:center;gap:11px;padding:11px 16px;
          border-bottom:1px solid var(--line);font-size:15px;font-weight:600;
          color:var(--muted);cursor:pointer;position:sticky;top:0;
          background:var(--card);z-index:1}
  .selall input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--accent)}

  .empty{color:var(--muted);font-size:15.5px;padding:20px 4px;text-align:center}
  .foot{color:var(--muted);font-size:13.5px;text-align:center;padding:14px 0 4px}
  [hidden]{display:none!important}

  /* ── Dark-theme overrides ─────────────────────────────────────────────
     LAST in the sheet on purpose. These are plain class selectors, same
     specificity as the rules they correct, so order is the only thing
     deciding the winner — declared higher up, the dark sign-out button
     silently lost to the light one and rendered pink on black. */
  @media (prefers-color-scheme:dark){
    header{box-shadow:0 4px 16px rgba(0,0,0,.5)}
    header .mark{background:rgba(255,255,255,.95)}
    .grab, .acts a.go{box-shadow:0 1px 3px rgba(0,0,0,.4)}
    /* --accent-soft is a near-black green; as a 1.5px border it vanished. */
    .acts a{border-color:#2d5a40}
    .grab.plain{border-color:#2d5a40}
    .who select, .yr select{border-color:#2d5a40}
    button.leave{background:#2b1512;color:#ff9385;border-color:#4a231d}
  }
</style>
</head>
<body>

<!-- One sprite sheet; every icon below is a <use> of it. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- A cardamom pod. The first attempt was 26x46 and read as a LEAF: a
       pod is plump, roughly two-thirds as wide as it is tall, widest below
       the middle, tapering to a point at the stalk end. Three ribs, because
       the pod is three-sided. Drawn once as a symbol so the sign-in can
       scatter a dozen for about a kilobyte - a photograph is the obvious
       alternative and the wrong one on a grower's mobile data. -->
  <symbol id="i-pod" viewBox="0 0 34 44">
    <path d="M17 2.5c7.8 6.2 12.5 15 12.5 23.2 0 8.4-5.4 15.3-12.5 15.3S4.5 34.1 4.5 25.7C4.5 17.5 9.2 8.7 17 2.5Z"
          fill="currentColor" fill-opacity=".92"/>
    <path d="M17 6.5V39" fill="none" stroke="#fff" stroke-opacity=".30" stroke-width="1.2"/>
    <path d="M10.6 12.5c-2.4 6-3 13.2-1 20.2" fill="none" stroke="#fff" stroke-opacity=".20" stroke-width="1.1"/>
    <path d="M23.4 12.5c2.4 6 3 13.2 1 20.2" fill="none" stroke="#fff" stroke-opacity=".20" stroke-width="1.1"/>
    <path d="M17 2.5C17 1.4 16.3 0.6 15 0" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

<header>
  <div class="hwrap">
    <span class="mark"><svg width="19" height="19"><use href="#i-leaf"/></svg></span>
    <span class="grow">
      <h1>My Documents</h1>
      <div class="co" id="co"></div>
    </span>
    <button class="out" id="out" title="Sign out" aria-label="Sign out" hidden>
      <svg width="17" height="17"><use href="#i-out"/></svg>
    </button>
  </div>
</header>

<div class="wrap">

  <!-- ── Step 1: phone ── -->
  <section id="step-phone">
   <div class="pods" aria-hidden="true">
     <svg class="p1" viewBox="0 0 34 44"><use href="#i-pod"/></svg>
     <svg class="p2" viewBox="0 0 34 44"><use href="#i-pod"/></svg>
     <svg class="p3" viewBox="0 0 34 44"><use href="#i-pod"/></svg>
     <svg class="p4" viewBox="0 0 34 44"><use href="#i-pod"/></svg>
     <svg class="p5" viewBox="0 0 34 44"><use href="#i-pod"/></svg>
   </div>
   <div>
    <div class="crest" aria-hidden="true">
      <svg viewBox="0 0 26 46" style="transform:rotate(-20deg)"><use href="#i-pod"/></svg>
      <svg class="mid" viewBox="0 0 34 44"><use href="#i-pod"/></svg>
      <svg viewBox="0 0 26 46" style="transform:rotate(20deg)"><use href="#i-pod"/></svg>
    </div>
    <div class="lead">
      <h2>Your documents</h2>
      <p>Sign in with the mobile number the office has for you.</p>
    </div>
   <div class="card">
    <label for="phone">Your mobile number</label>
    <div class="field">
      <span class="ico"><svg width="18" height="18"><use href="#i-phone"/></svg></span>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel"
             maxlength="15" placeholder="10-digit mobile number">
    </div>
    <button id="send"><svg width="16" height="16"><use href="#i-send"/></svg> Send code</button>
    <div class="msg err" id="err-phone" hidden></div>
   </div>
    <div class="assure">
      <div><svg width="17" height="17"><use href="#i-receipt"/></svg>
           <span>Every bill and invoice raised in your name, any year.</span></div>
      <div><svg width="17" height="17"><use href="#i-dl"/></svg>
           <span>View or save them as PDF — one at a time, or a whole year together.</span></div>
      <div><svg width="17" height="17"><use href="#i-lock"/></svg>
           <span>Only yours. We send a 6-digit code to that number to be sure it is you.</span></div>
    </div>
   </div>
  </section>

  <!-- ── Step 2: code ── -->
  <section id="step-code" hidden>
   <div class="card">
    <label for="code">Enter the 6-digit code sent to <span id="to"></span></label>
    <div class="field">
      <span class="ico"><svg width="18" height="18"><use href="#i-lock"/></svg></span>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" placeholder="······">
    </div>
    <div class="msg info" id="ttl"></div>
    <button id="verify">Sign in</button>
    <button class="ghost" id="resend"></button>
    <button class="ghost" id="back">Use a different number</button>
    <div class="msg err" id="err-code" hidden></div>
   </div>
  </section>

  <!-- ── Step 3: documents ── -->
  <section id="step-docs" hidden>
    <div class="who" id="who"></div>
    <div class="band" id="band" hidden></div>
    <div class="period" id="period" hidden>
      <span class="yr" id="yr"></span>
      <span class="yr" id="mo"></span>
    </div>
    <div class="bar">
      <span class="count" id="count"></span>
      <span class="btns">
        <button class="grab plain" id="pickbtn" hidden></button>
        <button class="grab" id="grab" hidden></button>
      </span>
    </div>
    <div class="card" id="doclist"></div>
  </section>

  <div class="foot" id="foot"></div>
  <!-- Outside the signed-in section on purpose: a customer who CANNOT sign
       in is exactly the one who needs the office's number. -->
  <div class="help" id="help" hidden></div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var token = sessionStorage.getItem('portal_token') || '';
  var parties = [], active = null, myPhone = '';
  var allDocs = [], fyPick = '', moPick = '';   // moPick '' = the whole year
  var selMode = false, sel = {};                // id → true, only while selecting
  var ticker = null, expiresAt = 0, resendAt = 0;
  var CO = {}, totals = {};


  function svg(id, size){
    return '<svg width="'+(size||17)+'" height="'+(size||17)+'" aria-hidden="true"><use href="'+id+'"/></svg>';
  }
  function show(step){
    $('step-phone').hidden = step !== 'phone';
    $('step-code').hidden  = step !== 'code';
    $('step-docs').hidden  = step !== 'docs';
  }
  function err(el, m){
    var e = $(el);
    if (!m) { e.hidden = true; return; }
    e.innerHTML = svg('#i-alert', 16) + '<span></span>';
    e.lastChild.textContent = m;
    e.hidden = false;
  }
  // Rupees 23.4 L / 1.23 Cr on the headline tile. A grower reads
  // "Rs 2,34,12,050" as a wall of digits; the lakh/crore shorthand is how
  // the amount is actually said out loud, and the exact figure sits right
  // underneath it anyway.
  function shortMoney(n){
    var v = Number(n) || 0;
    var trim = function(x){ return x.toFixed(2).replace(/\.?0+$/, ''); };
    if (v >= 1e7) return '\u20B9' + trim(v / 1e7) + ' Cr';
    if (v >= 1e5) return '\u20B9' + trim(v / 1e5) + ' L';
    return money(v);
  }
  function money(n){
    var v = Number(n);
    if (!isFinite(v)) return '';
    return '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }
  // ── Indian financial year: 1 April → 31 March ──────────────────────
  // A document dated 12 Feb 2027 belongs to FY 2026-27, not 2027-28. Derived
  // on the client from the date already in the list, so the year filter costs
  // no extra request.
  function fyOf(d){
    var m = String(d || '').match(/^(\d{4})-(\d{2})/);
    if (!m) return '';
    var y = Number(m[1]), mon = Number(m[2]);
    var start = mon >= 4 ? y : y - 1;
    return start + '-' + String((start + 1) % 100).padStart(2, '0');
  }

  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // "08 Oct", not "08/10/2026". The financial year is already chosen in the
  // picker directly above the list, so repeating it on every row spends the
  // width that "Auction 19" needs — and that is the one fact a grower rings
  // the office about.
  function when(d){
    if (!d) return '';
    var m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(d);
    return m[3] + ' ' + (MON[Number(m[2]) - 1] || m[2]);
  }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers || {});
    if (token) opts.headers.Authorization = 'Bearer ' + token;
    var r = await fetch(path, opts);
    var j = null;
    try { j = await r.json(); } catch(_) {}
    if (!r.ok) throw new Error((j && j.error) || 'Something went wrong. Please try again.');
    return j;
  }

  // ── Step 1 ──
  // One path for both the first send and a resend, so the countdown and the
  // cooldown can never be set by one and not the other.
  async function requestCode(again){
    var onCode = !!again;
    err(onCode ? 'err-code' : 'err-phone', '');
    var phone = $('phone').value.replace(/\D/g,'');
    if (phone.length < 10) return err('err-phone','Please enter your 10-digit mobile number.');
    var btn = onCode ? $('resend') : $('send');
    btn.disabled = true;
    try {
      var r = await api('/api/portal/otp/request', { method:'POST', body: JSON.stringify({ phone: phone }) });
      $('to').textContent = phone.slice(-10);
      $('code').value = '';
      if (!onCode) { show('code'); $('code').focus(); }
      startClock(r.ttlSeconds || 600, r.resendAfterSeconds || 45);
      // The server answers identically for a number it does not know, so
      // this wording is the only honest thing to say at this point.
      $('foot').textContent = 'If this number is registered with us, a code is on its way.';
    } catch(e){
      err(onCode ? 'err-code' : 'err-phone', e.message);
      btn.disabled = false;
    }
  }
  $('send').onclick = function(){ requestCode(false); };

  // ── The expiry clock ───────────────────────────────────────────────
  // A code with a ten-minute life has to SAY so, and keep saying it. A line
  // that reads "valid for 10 minutes" and then goes stale is worse than
  // none: the one thing a person needs to know at minute nine is how long
  // is left, and whether asking again is allowed yet.
  function mmss(sec){
    var m = Math.floor(sec / 60), s2 = sec % 60;
    return m + ':' + (s2 < 10 ? '0' : '') + s2;
  }
  function stopClock(){ if (ticker) { clearInterval(ticker); ticker = null; } }

  function startClock(ttlSec, cooldownSec){
    stopClock();
    expiresAt = Date.now() + ttlSec * 1000;
    resendAt  = Date.now() + (cooldownSec || 45) * 1000;
    tick();
    ticker = setInterval(tick, 1000);
  }

  function tick(){
    var left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
    var wait = Math.max(0, Math.round((resendAt - Date.now()) / 1000));
    var box = $('ttl'), rs = $('resend');

    if (left > 0) {
      box.className = 'msg info';
      box.innerHTML = svg('#i-clock', 16) + '<span>This code expires in <b></b>. '
        + 'Enter it before then — after that it stops working and you will need a new one.</span>';
      box.querySelector('b').textContent = mmss(left);
      $('verify').disabled = false;
    } else {
      box.className = 'msg warn';
      box.innerHTML = svg('#i-alert', 16) + '<span>This code has expired. Send a new one to carry on.</span>';
      $('verify').disabled = true;
      stopClock();
    }

    if (wait > 0 && left > 0) {
      rs.disabled = true;
      rs.textContent = 'Send again in ' + wait + 's';
    } else {
      rs.disabled = false;
      rs.textContent = 'Send a new code';
    }
  }

  $('resend').onclick = function(){ requestCode(true); };

  $('back').onclick = function(){
    stopClock();
    $('phone').value = ''; $('code').value = '';
    err('err-code',''); err('err-phone','');
    $('foot').textContent = '';
    show('phone');
    $('phone').focus();
  };

  // ── Step 2 ──
  $('verify').onclick = async function(){
    err('err-code','');
    var phone = $('phone').value.replace(/\D/g,'');
    var code  = $('code').value.replace(/\D/g,'');
    if (code.length !== 6) return err('err-code','Enter the 6-digit code.');
    $('verify').disabled = true;
    try {
      var r = await api('/api/portal/otp/verify', { method:'POST', body: JSON.stringify({ phone: phone, code: code }) });
      token = r.token;
      sessionStorage.setItem('portal_token', token);
      parties = r.parties || [];
      myPhone = r.phone || '';
      stopClock();
      $('foot').textContent = '';
      enter();
    } catch(e){ err('err-code', e.message); }
    $('verify').disabled = false;
  };

  // ── Step 3 ──
  function enter(){
    show('docs');
    $('out').hidden = false;
    var who = $('who');
    who.innerHTML = '';
    if (parties.length > 1) {
      // A dropdown rather than a row of tiles: one handset here can hold
      // seventeen parties, and the native picker stays one line however
      // many there are.
      var sel = document.createElement('div'); sel.className = 'sel';
      var s = document.createElement('select');
      s.setAttribute('aria-label','Choose whose documents to view');
      parties.forEach(function(p, i){
        var o = document.createElement('option');
        o.value = String(i);
        o.textContent = p.name + (p.kind === 'buyer' ? '  (buyer)' : '');
        s.appendChild(o);
      });
      s.onchange = function(){ select(Number(s.value)); };
      sel.innerHTML = '<span class="avatar">' + svg('#i-user',17) + '</span>'
                    + '<span class="chev">' + svg('#i-chev',16) + '</span>';
      sel.insertBefore(s, sel.firstChild);
      who.appendChild(sel);
    } else if (parties.length === 1) {
      var one = document.createElement('div'); one.className = 'one';
      one.innerHTML = '<span style="color:var(--accent)">' + svg('#i-user',18) + '</span>';
      var nm = document.createElement('span');
      nm.textContent = parties[0].name;
      one.appendChild(nm);
      who.appendChild(one);
    }
    // The signed-in number rides on the same line as the name.
    if (myPhone) {
      var sg = document.createElement('span');
      sg.className = 'signed';
      sg.textContent = myPhone;
      who.appendChild(sg);
    }
    select(0);
  }

  async function select(i){
    active = parties[i];
    if (!active) return;
    var list = $('doclist');
    $('count').textContent = '';
    $('period').hidden = true;
    $('grab').hidden = true;
    $('pickbtn').hidden = true;
    $('band').hidden = true;
    selMode = false; sel = {};
    list.innerHTML = '<div class="empty">Loading…</div>';
    try {
      var r = await api('/api/portal/documents?party=' + encodeURIComponent(active.kind + ':' + active.id));
      allDocs = r.documents || [];
      totals = r.totals || {};
      fyPick = ''; moPick = '';  // a new party starts on its own latest year
      selMode = false; sel = {};
      buildPeriod();
      render();
    } catch(e){
      if (/sign in/i.test(e.message)) return signedOut();
      allDocs = [];
      $('grab').hidden = true;
      $('pickbtn').hidden = true;
      list.innerHTML = '';
      $('count').textContent = '';
      var d = document.createElement('div'); d.className = 'empty'; d.textContent = e.message;
      list.appendChild(d);
    }
  }

  // Both pickers offer only periods this party actually HAS documents in —
  // an empty month in the list is a dead end the reader has to back out of.
  function selectEl(box, items, current, onPick, aria){
    box.innerHTML = '';
    var sel = document.createElement('select');
    sel.setAttribute('aria-label', aria);
    items.forEach(function(it){
      var o = document.createElement('option');
      o.value = it.v; o.textContent = it.t;
      if (it.v === current) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function(){ onPick(sel.value); };
    box.appendChild(sel);
    var ch = document.createElement('span'); ch.className = 'chev';
    ch.innerHTML = svg('#i-chev', 15);
    box.appendChild(ch);
  }

  function buildPeriod(){
    var years = [];
    allDocs.forEach(function(d){
      var f = fyOf(d.date);
      if (f && years.indexOf(f) === -1) years.push(f);
    });
    years.sort().reverse();
    if (!years.length) { $('period').hidden = true; return; }
    if (!fyPick || years.indexOf(fyPick) === -1) fyPick = years[0];

    selectEl($('yr'), years.map(function(y){ return { v:y, t:'FY ' + y }; }), fyPick,
      function(v){ fyPick = v; moPick = ''; selMode = false; sel = {}; buildPeriod(); render(); }, 'Financial year');

    // Months WITHIN the chosen year, newest first, plus "whole year".
    var months = [];
    allDocs.forEach(function(d){
      if (fyOf(d.date) !== fyPick) return;
      var ym = String(d.date || '').slice(0, 7);
      if (ym && months.indexOf(ym) === -1) months.push(ym);
    });
    months.sort().reverse();
    if (moPick && months.indexOf(moPick) === -1) moPick = '';
    var opts = [{ v:'', t:'Whole year' }].concat(months.map(function(m){
      return { v:m, t: MON[Number(m.slice(5,7)) - 1] + ' ' + m.slice(0,4) };
    }));
    selectEl($('mo'), opts, moPick, function(v){ moPick = v; selMode = false; sel = {}; render(); }, 'Month');
    $('period').hidden = false;
  }

  // The band above the list, scoped to the chosen YEAR — "how much did I
  // make this season" is the question. A lifetime total answers one nobody
  // asked and quietly changes meaning as the years roll.
  function drawTiles(){
    var box = $('band');
    var t = totals[fyPick];
    if (!t || !t.documents) { box.hidden = true; return; }
    var noun = (active && active.kind === 'buyer') ? 'Paid' : 'Earned';
    var qty = Number(t.qty) || 0;
    var qtyTxt = qty >= 1000 ? (qty / 1000).toFixed(2) + ' t' : qty.toFixed(0) + ' kg';
    box.innerHTML =
        '<span class="big"><span class="k">' + noun + ' FY ' + fyPick + '</span>'
      + '<div class="v">' + shortMoney(t.amount) + '</div></span>'
      + '<span class="side"><span class="k">Cardamom</span>'
      + '<div class="v">' + qtyTxt + '</div></span>'
      + '<span class="side"><span class="k">Last</span>'
      + '<div class="v">' + (when(t.lastDate) || '-') + '</div></span>';
    box.hidden = false;
  }

  // Who to ring. A statement nobody can query is a complaint in waiting.
  function drawHelp(){
    var box = $('help');
    if (!CO.company) { box.hidden = true; return; }
    var strip = '<button class="strip" type="button" id="helpbtn">'
      + '<span class="nm">' + CO.company + '</span>'
      + (CO.phone ? '<span class="call">' + svg('#i-call', 16) + '</span>' : '')
      + '<span style="color:var(--muted)">' + svg('#i-chev', 15) + '</span></button>';
    var more = '<div class="more">';
    // The address is a BLOCK of its own: inline-flex links flowing straight
    // after it put "Call the office" alongside the last line of the address.
    if (CO.address && CO.address.length) {
      more += '<div class="addr">' + CO.address.join('<br>')
            + (CO.state ? '<br>' + CO.state : '') + '</div>';
    }
    var links = '';
    if (CO.phone) links += '<a href="tel:' + CO.phone + '">' + svg('#i-call', 15) + 'Call the office</a>';
    if (CO.email) links += '<a href="mailto:' + CO.email + '">' + svg('#i-mail', 15) + 'Email</a>';
    if (links) more += '<div class="links">' + links + '</div>';
    if (CO.gstin) more += '<div class="gst">GSTIN ' + CO.gstin + '</div>';
    more += '</div>';
    box.innerHTML = strip + more;
    box.hidden = false;
    $('helpbtn').onclick = function(){ box.classList.toggle('open'); };
  }

  function render(){
    var list = $('doclist');
    var docs = allDocs.filter(function(d){
      if (fyPick && fyOf(d.date) !== fyPick) return false;
      if (moPick && String(d.date || '').slice(0, 7) !== moPick) return false;
      return true;
    });
    list.innerHTML = '';
    list.scrollTop = 0;
    if (!docs.length) {
      list.innerHTML = '<div class="empty">' + svg('#i-inbox', 28)
        + '<div style="margin-top:8px">'
        + (allDocs.length ? 'Nothing in this period.' : 'No documents yet for this account.')
        + '</div></div>';
      $('count').textContent = '';
      $('grab').hidden = true;
      $('pickbtn').hidden = true;
      drawTiles();
      drawHelp();
      return;
    }
    $('count').textContent = docs.length + ' document' + (docs.length === 1 ? '' : 's');

    drawBar(docs);
    drawTiles();
    drawHelp();

    // A "select all" header, sticky so it stays reachable in a long list.
    if (selMode) {
      var head = document.createElement('label'); head.className = 'selall';
      var all = document.createElement('input'); all.type = 'checkbox';
      var every = docs.every(function(d){ return sel[d.id]; });
      all.checked = every && docs.length > 0;
      all.onchange = function(){
        docs.forEach(function(d){ if (all.checked) sel[d.id] = true; else delete sel[d.id]; });
        render();
      };
      head.appendChild(all);
      var lbl = document.createElement('span');
      lbl.textContent = every ? 'Clear all' : 'Select all';
      head.appendChild(lbl);
      list.appendChild(head);
    }

    docs.forEach(function(d, i){
      var row = document.createElement('div');
      row.className = (i % 2 ? 'doc alt' : 'doc') + (selMode && sel[d.id] ? ' on' : '');
      var open = '/api/portal/documents/' + d.kind + '/' + d.id + '/pdf?token=' + encodeURIComponent(token);

      if (selMode) {
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.className = 'pick';
        cb.checked = !!sel[d.id];
        cb.setAttribute('aria-label', 'Select ' + d.label + ' ' + (d.no || ''));
        cb.onchange = function(){
          if (cb.checked) sel[d.id] = true; else delete sel[d.id];
          row.className = (i % 2 ? 'doc alt' : 'doc') + (cb.checked ? ' on' : '');
          drawBar(docs);
          var head = list.querySelector('.selall input');
          if (head) {
            head.checked = docs.every(function(x){ return sel[x.id]; });
            head.parentNode.lastChild.textContent = head.checked ? 'Clear all' : 'Select all';
          }
        };
        row.appendChild(cb);
        // The whole row toggles, not just the 24px box — a thumb is wider
        // than the control.
        row.onclick = function(ev){ if (ev.target !== cb) { cb.checked = !cb.checked; cb.onchange(); } };
      }

      var g = document.createElement('div'); g.className = 'grow';
      var top = document.createElement('div'); top.className = 'top';
      var t = document.createElement('div'); t.className = 't';
      t.textContent = d.label + ' ' + (d.no || '');
      var amt = document.createElement('div'); amt.className = 'amt';
      amt.textContent = money(d.amount);
      top.appendChild(t); top.appendChild(amt);
      var sub = document.createElement('div'); sub.className = 's';
      sub.textContent = when(d.date) + (d.ano ? ' \u00b7 Auction ' + d.ano : '');
      g.appendChild(top); g.appendChild(sub);
      row.appendChild(g);

      if (!selMode) {
        // Tapping the row opens the document; the one button left is SAVE.
        // Two equal squares per row read as a toolbar, not a statement.
        row.setAttribute('role', 'button');
        row.setAttribute('aria-label', 'Open ' + d.label + ' ' + (d.no || ''));
        row.onclick = function(){ window.open(open, '_blank', 'noopener'); };
        var acts = document.createElement('div'); acts.className = 'acts';
        var dl = document.createElement('a');
        dl.href = open + '&dl=1';
        dl.title = 'Save'; dl.setAttribute('aria-label', 'Download ' + d.label);
        dl.innerHTML = svg('#i-dl', 17);
        // The row's own tap would fire too and open a second copy.
        dl.onclick = function(ev){ ev.stopPropagation(); };
        acts.appendChild(dl);
        row.appendChild(acts);
        var go = document.createElement('span'); go.className = 'go';
        go.innerHTML = svg('#i-go', 17);
        row.appendChild(go);
      }

      list.appendChild(row);
    });
  }

  // The bar under the pickers. Two states, because the question changes:
  // browsing asks "do you want the lot?", selecting asks "do you want these?".
  function drawBar(docs){
    var picked = docs.filter(function(d){ return sel[d.id]; });
    var count = $('count'), pick = $('pickbtn'), grab = $('grab');

    if (selMode) {
      count.textContent = picked.length
        ? picked.length + ' selected'
        : 'Tap to select';
      pick.hidden = false;
      pick.innerHTML = '<span>Cancel</span>';
      pick.onclick = function(){ selMode = false; sel = {}; render(); };
      grab.hidden = false;
      grab.disabled = picked.length === 0;
      grab.innerHTML = svg('#i-dl', 15) + '<span></span>';
      grab.lastChild.textContent = 'Download ' + (picked.length || '');
      grab.onclick = function(){
        if (picked.length) downloadDocs(picked.map(function(d){ return d.id; }), picked.length);
      };
      return;
    }

    count.textContent = docs.length + ' document' + (docs.length === 1 ? '' : 's');
    // Nothing to pick BETWEEN when there is one row — the row's own buttons
    // already do everything select mode could.
    pick.hidden = docs.length < 2;
    pick.innerHTML = svg('#i-check', 15) + '<span>Select</span>';
    pick.onclick = function(){ selMode = true; sel = {}; render(); };
    grab.hidden = false;
    grab.disabled = false;
    grab.innerHTML = svg('#i-dl', 15) + '<span></span>';
    grab.lastChild.textContent = docs.length === 1 ? 'Download' : 'Download all ' + docs.length;
    grab.onclick = function(){ downloadDocs(null, docs.length); };
  }

  // Fetched rather than linked so a failure can be SHOWN. A plain <a> to a
  // route that 413s lands the reader on a page of raw JSON with no way back.
  // ids = null → everything in the current period. ids = [...] → just those.
  async function downloadDocs(ids, n){
    var grab = $('grab');
    grab.disabled = true;
    grab.innerHTML = svg('#i-dl', 15) + '<span>Preparing…</span>';
    var qs = '/api/portal/documents/bulk?party=' + encodeURIComponent(active.kind + ':' + active.id)
           + (ids ? '&ids=' + ids.join(',')
                  : '&fy=' + encodeURIComponent(fyPick)
                    + (moPick ? '&month=' + encodeURIComponent(moPick) : ''))
           + '&token=' + encodeURIComponent(token);
    try {
      var r = await fetch(qs);
      if (!r.ok) {
        var j = null; try { j = await r.json(); } catch(_) {}
        throw new Error((j && j.error) || 'Could not build that file.');
      }
      var blob = await r.blob();
      var cd = r.headers.get('content-disposition') || '';
      var m = cd.match(/filename="([^"]+)"/);
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = (m && m[1]) || 'documents.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 20000);
    } catch (e) {
      var box = $('doclist');
      var warn = document.createElement('div');
      warn.className = 'msg err';
      warn.innerHTML = svg('#i-alert', 16) + '<span></span>';
      warn.lastChild.textContent = e.message;
      box.insertBefore(warn, box.firstChild);
      setTimeout(function(){ warn.remove(); }, 7000);
    }
    // Leaving select mode after a successful grab is the expected ending —
    // the task is finished, and a screen full of ticks says it is not.
    if (selMode) { selMode = false; sel = {}; }
    render();
  }

  // Every way back to the sign-in screen goes through here. There were two
  // of these — sign out, and session expired — and they had already drifted:
  // neither cleared the number field, so the next person to pick up the
  // phone found the previous one's mobile number waiting in the box.
  function resetToSignIn(message){
    stopClock();
    token = ''; sessionStorage.removeItem('portal_token');
    parties = []; active = null; myPhone = '';
    allDocs = []; totals = {}; fyPick = ''; moPick = ''; selMode = false; sel = {};
    $('phone').value = '';
    $('code').value = '';
    $('to').textContent = '';
    err('err-phone', ''); err('err-code', '');
    $('foot').textContent = '';
    $('out').hidden = true;
    $('band').hidden = true;
    $('period').hidden = true;
    $('grab').hidden = true;
    $('pickbtn').hidden = true;
    $('count').textContent = '';
    $('doclist').innerHTML = '';
    show('phone');
    if (message) err('err-phone', message);
  }

  function signedOut(){
    resetToSignIn('Your sign-in has expired. Please sign in again.');
  }

  $('out').onclick = async function(){
    try { await api('/api/portal/logout', { method:'POST' }); } catch(_){}
    resetToSignIn();
  };

  $('phone').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('send').click(); });
  $('code').addEventListener('keydown',  function(e){ if (e.key === 'Enter') $('verify').click(); });

  // Boot: name the company, and resume a session that is still good.
  (async function(){
    try {
      CO = (await fetch('/api/portal/config').then(function(r){ return r.json(); })) || {};
      if (CO.company) {
        // The company's name leads and "My Documents" becomes the subtitle:
        // the page should say WHOSE it is before it says what it is.
        document.querySelector('header h1').textContent = CO.company;
        $('co').textContent = 'My Documents';
        document.title = CO.company + ' - My Documents';
      }
      if (CO.logoUrl) {
        var mark = document.querySelector('header .mark');
        var img = new Image();
        img.alt = ''; img.src = CO.logoUrl;
        // Swap the leaf out only once the real logo has loaded - a broken
        // image icon in the bar is worse than the placeholder.
        img.onload = function(){ mark.innerHTML = ''; mark.appendChild(img); };
      }
      // The contact strip is drawn once, at boot, because it now sits
      // outside the signed-in section — a customer who CANNOT sign in is
      // exactly the one who needs the office's number.
      drawHelp();
    } catch(_){}
    if (token) {
      try {
        var me = await api('/api/portal/me');
        parties = me.parties || [];
        myPhone = me.phone || '';
        return enter();
      } catch(_){ token=''; sessionStorage.removeItem('portal_token'); }
    }
    show('phone');
  })();
})();
</script>
</body>
</html>
